# Vendored from squidowl/iced at 138b1d0 (winit/), with a working clipboard for
# the web build (src/clipboard.rs, wasm32). Workspace values are inlined.
# Remove once iced has web clipboard support upstream.
[package]
name = "iced_winit"
description = "A runtime for iced on top of winit"
version = "0.15.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/iced-rs/iced"

[features]
default = ["x11", "wayland"]
debug = ["iced_debug/enable"]
sysinfo = ["dep:sysinfo"]
unconditional-rendering = []
linux-theme-detection = ["dep:mundy", "mundy/async-io", "mundy/color-scheme"]
image = ["iced_runtime/image", "arboard/image-data"]
x11 = ["winit/x11"]
wayland = ["winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita", "arboard/wayland-data-control"]

[dependencies]
iced_debug = { version = "0.15.0-dev", git = "https://github.com/squidowl/iced", rev = "138b1d0ddc86e108f7d4f25765afca126a8dc166" }
iced_program = { version = "0.15.0-dev", git = "https://github.com/squidowl/iced", rev = "138b1d0ddc86e108f7d4f25765afca126a8dc166" }
iced_runtime = { version = "0.15.0-dev", git = "https://github.com/squidowl/iced", rev = "138b1d0ddc86e108f7d4f25765afca126a8dc166" }
log = "0.4"
rustc-hash = "2.0"
thiserror = "2"
tracing = "0.1"
winit = { git = "https://github.com/iced-rs/winit.git", rev = "05b8ff17a06562f0a10bb46e6eaacbe2a95cb5ed", default-features = false, features = ["rwh_06"] }
sysinfo = { version = "0.33", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.85", features = ["Document", "Window", "HtmlCanvasElement", "Navigator", "Clipboard"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
mundy = { version = "0.2", default-features = false, optional = true }

# Delete once we update to `winit 0.31`
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", features = ["relax-sign-encoding"] }
