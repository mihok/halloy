[package]
name = "data"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "data"
path = "src/lib.rs"

[features]
tor = ["irc/tor"]
message_tests = ["iced/tokio"]

[dependencies]
hashbrown = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
strum = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
timeago = { workspace = true }
itertools = { workspace = true }
emojis = { workspace = true }
unicode-segmentation = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
palette = { workspace = true }
log = { workspace = true }
nucleo-matcher = { workspace = true }
tokio-util = { workspace = true }
const_format = { workspace = true }
nom = { workspace = true }
percent-encoding = { workspace = true }
keyring-core = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

equivalent = "1.0"
base64 = "0.23.0"
dirs-next = "2.0.0"
xdg = "3.0.0"
flate2 = "1.0"
hex = "0.4.3"
iced_core = "0.15.0-dev"
iced_wgpu = "0.15.0-dev"
indexmap = { version = "2.14", features = ["std", "serde"] }
seahash = "4.1.0"
serde_json = "1.0"
serde_ignored = "0.1"
serde-untagged = "0.1"
sha2 = "0.11.0"
toml = { version = "1.1.4", features = ["preserve_order"] }
fancy-regex = "0.20"
walkdir = "2.5.0"
derive_more = { version = "2.0.1", features = ["full"] }
image = "0.25.10"
gif = "0.14.1"
html-escape = "0.3.0"
infer = "0.22"
sys-locale = "0.3"
mime_guess = "2.0.5"
any_ascii = "0.3.3"
idna = "1.1.0"
unicode-security = "0.1.2"
version-compare = "0.2"
sanitize-filename = "0.6.0"
# std::time::Instant on desktop, performance.now() in the browser
web-time = "1"

# Native (desktop) builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["io-util", "fs", "rt"] }
tokio-stream = { workspace = true, features = ["time", "fs"] }
reqwest = { workspace = true }
iced = { workspace = true, features = [
    "sysinfo",
    "tokio",
    "wayland",
] }
display-info = "0.5.9"

# Web port (wasm32): no filesystem, processes, sockets or tokio runtime.
# See web/PORTING.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["io-util", "rt", "sync", "macros"] }
tokio-stream = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "json",
    "stream",
] }
# wgpu over WebGL2 (WebGPU isn't in every browser yet), tiny-skia as the
# software fallback, browser color handling.
iced = { workspace = true, features = ["wgpu", "webgl", "tiny-skia", "web-colors"] }
wasm-bindgen-futures = "0.4"
wasmtimer = "0.4"
# rand -> getrandom needs the browser's crypto.getRandomValues
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = [
    "keychain",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = [
    "rt-tokio-crypto-rust",
] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[dev-dependencies]
serde_test = "1.0"
tempfile = "3"

[dependencies.irc]
path = "../irc"

[dependencies.serde]
version = "1.0"
features = ["derive", "rc"]

[lints]
workspace = true
