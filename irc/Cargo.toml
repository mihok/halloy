[package]
name = "irc"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
tor = ["arti-client"]

[dependencies]
thiserror = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
tokio-util = { version = "0.7", features = ["codec"] }

# Native transports: TCP, TLS, proxies, Tor.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["full"] }
arti-client = { version = "0.47", default-features = false, features = [
    "rustls",
    "compression",
    "tokio",
    "static-sqlite",
    "onion-service-client",
], optional = true }
async-http-proxy = { version = "1.2.5", features = [
    "runtime-tokio",
    "basic-auth",
] }
fast-socks5 = "1.0.0"
tokio-rustls = { version = "0.26.0", default-features = false, features = [
    "tls12",
    "ring",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "handshake",
] }
rustls-platform-verifier = "0.7.1"
xz2 = { version = "0.1.7", features = ["static"] }

# slashcheer fork: browser transport (src/connection_web.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["sync"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
send_wrapper = "0.6"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "Event",
] }

[dependencies.proto]
path = "proto"
package = "irc_proto"

[lints]
workspace = true
