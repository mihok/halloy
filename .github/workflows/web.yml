name: web

# Checks for the browser (wasm32) port. See web/PORTING.md.
on:
  push:
    branches: [web-port]
  pull_request:
    branches: [web-port]

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: web port builds for the browser (clippy, no warnings)
        run: cargo clippy --target wasm32-unknown-unknown -p irc -p data -p rfd-web -p halloy -- -D warnings
      - name: data crate native tests
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          cargo test -p data
      - name: irc crate native tests
        run: cargo test -p irc -p irc_proto
      - name: smoke test bundle builds
        run: cargo clippy --target wasm32-unknown-unknown -p halloy-web-smoke -- -D warnings
