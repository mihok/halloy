name: web

# Checks for the browser (wasm32) port. See web/PORTING.md.
on:
  push:
    branches: [web-port]
  pull_request:
    branches: [web-port]

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: web port builds for the browser (clippy, no warnings)
        run: cargo clippy --target wasm32-unknown-unknown -p irc -p data -p rfd-web -p halloy -- -D warnings
      - name: data crate native tests
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          cargo test -p data
      - name: irc crate native tests
        run: cargo test -p irc -p irc_proto
      - name: smoke test bundle builds
        run: cargo clippy --target wasm32-unknown-unknown -p halloy-web-smoke -- -D warnings

  # Publish the browser bundle for slashcheer-irc, which pins a release
  # (tag + sha256) and serves it at /web/.
  bundle:
    if: github.event_name == 'push'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-bindgen CLI (matching Cargo.lock)
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: build bundle
        run: web/build.sh
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="web-${GITHUB_SHA::12}"
          gh release create "$tag" \
            web/halloy-web.tar.gz web/halloy-web.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "Halloy web bundle $tag" \
            --notes "Browser build of web-port at $GITHUB_SHA. sha256: $(cut -d' ' -f1 web/halloy-web.tar.gz.sha256)" \
            --prerelease
