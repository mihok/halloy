# slashcheer (light): neutral warm off-white (as on the website), the avatar's
# indigo (#1c024f) for text and accents, coral kept for mentions and the backlog line.
# Shipped with the web build (src/web.rs).

[general]
background = "#f3f1ec"
horizontal_rule = "#e6e1d8"
horizontal_rule_text = "#716c7d"
scrollbar = "#d8d2c6"
unread_indicator = "#1c024f"
highlight_indicator = "#e8553f"
border = "#e0dbd1"

[text]
primary = "#1c024f"
secondary = "#5e5a6e"
tertiary = "#1c024f"
success = "#3f6b00"
error = "#b8213a"
warning = "#995400"
info = "#1f5fa8"
debug = "#5e5a6e"
trace = "#716c7d"

[buffer]
background = "#fbfaf7"
background_text_input = "#f3f1ec"
background_title_bar = "#f3f1ec"
timestamp = "#716c7d"
action = "#1c024f"
topic = "#5e5a6e"
highlight = "#ffe3db"
code = "#8a2b6b"
nickname = "#1c024f"
nickname_offline = "#747084"
url = "#1f5fa8"
selection = "#eae2f8"
border_selected = "#1c024f"
focus_border = "#1c024f"
focus_background = "#f3f1ec"
backlog_rule = "#e8553f"
backlog_rule_text = "#c43d28"
date_rule = "#e6e1d8"
date_rule_text = "#716c7d"

[buffer.server_messages]
default = "#6f6a7c"

[buttons.primary]
background = "#f3f1ec"
background_hover = "#ebe8e1"
background_selected = "#dcdcdc"
background_selected_hover = "#d1d1d1"

[buttons.secondary]
background = "#ebe8e1"
background_hover = "#e2ded5"
background_selected = "#eae2f8"
background_selected_hover = "#ded2f4"

[formatting]
white = "#ffffff"
black = "#1c024f"
blue = "#2450c8"
green = "#3f7a1a"
red = "#b8213a"
brown = "#7a4a1e"
magenta = "#9b2fae"
orange = "#c4560f"
yellow = "#8a7400"
lightgreen = "#4f8a00"
cyan = "#0b7f86"
lightcyan = "#127a8a"
lightblue = "#1f5fa8"
pink = "#c2306a"
grey = "#6b5f93"
lightgrey = "#8a80a8"
