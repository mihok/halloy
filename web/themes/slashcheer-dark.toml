# slashcheer (dark): near-black surfaces, soft off-white text, the avatar's
# indigo (#1c024f) only as accents: exact for fills (selection, mentions,
# selected items), same-hue tints for lines and text so they stay visible. No coral, yellow
# or lime. Shipped with the web build (src/web.rs).

[general]
background = "#0e0e13"
horizontal_rule = "#22222c"
horizontal_rule_text = "#85839a"
scrollbar = "#2a2a36"
unread_indicator = "#764acb"
highlight_indicator = "#b198e1"
border = "#26263a"

[text]
primary = "#e8e6f0"
secondary = "#a3a1b5"
tertiary = "#b198e1"
success = "#8ab4ff"
error = "#f26d85"
warning = "#b198e1"
info = "#8ab4ff"
debug = "#a3a1b5"
trace = "#85839a"

[buffer]
background = "#121218"
background_text_input = "#0b0b10"
background_title_bar = "#0b0b10"
timestamp = "#85839a"
action = "#b198e1"
topic = "#a3a1b5"
highlight = "#1c024f"
code = "#b8b2e8"
nickname = "#b198e1"
nickname_offline = "#7f7d94"
url = "#8ab4ff"
selection = "#1c024f"
border_selected = "#764acb"
focus_border = "#764acb"
focus_background = "#0b0b10"
backlog_rule = "#8e6bd4"
backlog_rule_text = "#a3a1b5"
date_rule = "#22222c"
date_rule_text = "#85839a"

[buffer.server_messages]
default = "#85839a"

[buttons.primary]
background = "#0e0e13"
background_hover = "#18181f"
background_selected = "#1c024f"
background_selected_hover = "#230363"

[buttons.secondary]
background = "#18181f"
background_hover = "#22222c"
background_selected = "#1c024f"
background_selected_hover = "#2a0377"

[formatting]
white = "#fcfacf"
black = "#11012d"
blue = "#7aa2ff"
green = "#a6d96a"
red = "#ff6b85"
brown = "#c08a5b"
magenta = "#e07ff0"
orange = "#ffb36b"
yellow = "#f5e663"
lightgreen = "#e3fc62"
cyan = "#5fd7d7"
lightcyan = "#9ff0ee"
lightblue = "#9fd8ff"
pink = "#ffa6c9"
grey = "#8578ab"
lightgrey = "#c9c3d9"
