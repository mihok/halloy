background_text_input = "#11012d"
background_title_bar = "#11012d"
timestamp = "#8578ab"
action = "#c9b8ff"
topic = "#a99fc4"
highlight = "#3b1f86"
code = "#9fd8ff"
nickname = "#c9b8ff"
nickname_offline = "#6f6592"
url = "#9fd8ff"
