# slashcheer (dark): the avatar's indigo window with cream text and
# blue / lavender accents. Shipped with the web build (src/web.rs).

[general]
background = "#1c024f"
horizontal_rule = "#2e1468"
horizontal_rule_text = "#9d90c2"
scrollbar = "#3a1d7a"
unread_indicator = "#c9b8ff"
highlight_indicator = "#fcfacf"
border = "#3a1d7a"

[text]
primary = "#fcfacf"
secondary = "#a99fc4"
tertiary = "#c9b8ff"
success = "#9fd8ff"
error = "#ff6b85"
warning = "#ffb36b"
info = "#9fd8ff"
debug = "#b9a7f0"
trace = "#d8d4e6"

[buffer]
