# Browser stand-in for the `rfd` file-dialog crate (web port). The app
# depends on it under the name `rfd` only on wasm32, so upstream call sites
# (`rfd::AsyncFileDialog::new()...`) compile unchanged.
[package]
name = "rfd-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
data = { path = "../../data" }
futures = "0.3"
log = { workspace = true }
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "Blob",
] }
