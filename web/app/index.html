<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>IRC</title>
<!-- Set by the hosting site; see web/PORTING.md. -->
<meta name="halloy-network" content="irc">
<meta name="halloy-websocket-path" content="/web/irc">
<!-- optional: <meta name="halloy-channels" content="#general, #random"> -->
<style>
  /* Matches the slashcheer themes Halloy loads (web/themes/), so there's no
     flash between this page and the app. */
  :root { --bg: #fbfaf7; --fg: #5e5a6e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121218; --fg: #a3a1b5; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #iced { width: 100%; height: 100%; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--fg); font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="loading">Connecting…</div>
<div id="iced"></div>
<script>
  // Paste without a permission prompt. winit cancels every keydown, so a
  // Ctrl/Cmd+V would never become a browser paste. Let that one through: the
  // app still sees the key (and asks for the clipboard), and the browser's paste
  // event hands over the text. icedClipboardRead() (used by iced's web clipboard,
  // vendor/iced_winit) returns it, or falls back to navigator.clipboard.readText().
  (() => {
    let pasted = null; // { text, at }
    let waiting = [];
    addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "v") e.preventDefault = () => {};
    }, true);
    document.addEventListener("paste", (e) => {
      const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
      e.preventDefault();
      pasted = { text, at: performance.now() };
      const w = waiting; waiting = [];
      for (const resolve of w) resolve(text);
    });
    window.icedClipboardRead = () => {
      if (pasted && performance.now() - pasted.at < 1000) {
        const { text } = pasted; pasted = null;
        return Promise.resolve(text);
      }
      // The app may ask before the browser's paste event arrives: give it a moment.
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          waiting = waiting.filter((w) => w !== done);
          if (navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(resolve, reject);
          else reject(new Error("clipboard unavailable"));
        }, 250);
        const done = (text) => { clearTimeout(timer); pasted = null; resolve(text); };
        waiting.push(done);
      });
    };
  })();
</script>
<script type="module">
  import init from "./pkg/halloy.js";
  const network = document.querySelector('meta[name="halloy-network"]')?.content;
  if (network) document.title = `${network} IRC`;
  await init();
  document.getElementById("loading")?.remove();
</script>
</body>
</html>
