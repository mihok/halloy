<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloy</title>
<!-- Set by the hosting site; see web/PORTING.md. -->
<meta name="halloy-network" content="irc">
<meta name="halloy-websocket-path" content="/webirc">
<!-- optional: <meta name="halloy-channels" content="#general, #random"> -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
  #iced { width: 100%; height: 100%; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #9a9a9a; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="loading">Loading Halloy…</div>
<div id="iced"></div>
<script type="module">
  import init from "./pkg/halloy.js";
  await init();
  document.getElementById("loading")?.remove();
</script>
</body>
</html>
