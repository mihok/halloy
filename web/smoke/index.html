<!doctype html>
<meta charset="utf-8">
<title>halloy web smoke</title>
<script type="module">
  import init, { smoke } from "./pkg/halloy_web_smoke.js";
  await init();
  try {
    window.result = await smoke(location.hostname, Number(location.port), location.protocol === "https:", "/webirc");
  } catch (e) {
    window.result = ["FAILED " + e];
  }
  window.done = true;
</script>
